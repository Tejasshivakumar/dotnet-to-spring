name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build, test and measure coverage
        run: mvn -B verify

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco
          path: '**/target/site/jacoco'

  fixture:
    name: Sample .NET project compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The fixture is the input to every golden test. If it stops being valid
      # C#, the expectations downstream are meaningless.
      - name: Build fixture
        run: dotnet build sample-dotnet/BookstoreApi/BookstoreApi.csproj --nologo
