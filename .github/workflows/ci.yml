name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build, test and measure coverage
        run: mvn -B verify

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco
          path: '**/target/site/jacoco'

  frontend:
    name: Frontend (build and test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: npm run test --prefix web

  fixture:
    name: Sample .NET project compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # The fixture is the input to every golden test. If it stops being valid
      # C#, the expectations downstream are meaningless.
      - name: Build fixture
        run: dotnet build sample-dotnet/BookstoreApi/BookstoreApi.csproj --nologo
